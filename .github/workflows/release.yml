name: Release
on:
  push: {tags: ['v*']}
permissions: {contents: write}
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      # go.mod stays at go 1.22 so the module builds on 1.22, but release binaries are built
      # with the current stable Go: 1.22 is out of support, and its net/http, crypto/tls and
      # archive/tar fixes stopped. CI tests both.
      - uses: actions/setup-go@v6
        with: {go-version: stable}
      - name: tag matches the version in main.go
        run: grep -q "var version = \"${GITHUB_REF_NAME#v}\"" cmd/tickcheck/main.go
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with: {version: '~> v2', args: release --clean}
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
  verify:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install.sh from the release, checksum checked, binary runs
        run: |
          sleep 5
          TICKCHECK_BIN="$PWD/bin" sh site/install.sh
          ./bin/tickcheck version | grep -q "${GITHUB_REF_NAME#v}"
          set +e; ./bin/tickcheck --demo --no-color >/dev/null; code=$?; set -e
          test "$code" = 4
